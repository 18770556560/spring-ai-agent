spring:
  rabbitmq:
    # rabbit 服务地址
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    # 虚拟主机，默认 /
    virtual-host: /
    # 开启消息确认（生产可靠）
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    # 消费者手动ACK（推荐，防止消息丢失）
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10 # 一次预取10条，控制消费并发
  ai:
    alibaba:
      toolcalling:
        metaso:
#          https://metaso.cn/search-api/api-keys 获取key
          api-key: ${METASO_API_KEY}}

        weather:
          api-key: ${WEATHER_API_KEY}

        baidu:
          search:
#            https://www.searchapi.io/  获取key
            api-key: ${BAIDU_SEARCH_API_KEY}
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: deepseek-r1:1.5b
          temperature: 0.7
    dashscope:
      rerank:
        api-key: ${DASHSCOPE_API_KEY}
        options:
          model: qwen3-vl-rerank
      embedding:
        options:
          model: text-embedding-v3

      api-key: ${DASHSCOPE_API_KEY}
#      api-key: sk-ws-H.REMYMMD.nEps.MEQCIHlRzWYx6kji-hLAz20x4IxN6ept6IdkmBCntyqjw6tQAiAmiQga9MdowLVu0DacHzmV0iLmqRcmpJ8NzdviSgEFhA
      chat:
        options:
          model: qwen-plus
        api-key: ${DASHSCOPE_API_KEY}

    vectorstore:
      pgvector:
        initialize-schema: true # 确保此值为 true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    mcp:
#      server:
#        enabled: true
#        # 1. 启用 STDIO 传输
#        stdio: true
#        # 2. WebMVC 模式下默认就是 SSE，也可以显式指定
#        protocol: SSE
#        # 可选：配置SSE端点路径
#        sse-endpoint: /sse
#        sse-message-endpoint: /mcp/message
#        type: sync
#      client:
#        stdio:
#          servers-configuration: classpath:mcp-servers.json
#        sse:
#          connections:
#            servers1:
#              url: http://localhost:8081
        annotation-scanner:
          # 关闭 MCP 注解扫描（避免扫描 SpringDoc Querydsl 类时因缺少依赖而报错）
          # MCP 工具通过 mcp-servers.json 配置，不依赖注解扫描
          enabled: false
        request-timeout: 30s
        type: sync

  datasource:
    mysql:
      # 1. 数据库驱动类名 (MySQL 8.0+ 使用 com.mysql.cj.jdbc.Driver)
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 2. 数据库连接 URL
      # 注意替换：localhost:3306 为你的数据库地址，your_database 为你的库名
      # useSSL=false: 关闭SSL验证(开发环境常用)
      # serverTimezone=Asia/Shanghai: 设置时区，避免时间错误
      # allowPublicKeyRetrieval=true: 允许公钥检索(解决某些连接认证问题)
#      url: jdbc:mysql://localhost:3306/spring_ai_agent?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      jdbc-url: jdbc:mysql://${MYSQL_ADDRESS}/spring_ai_agent?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      # 3. 数据库用户名
      username: ${MYSQL_USERNAME}
      # 4. 数据库密码
      password: ${MYSQL_PASSWORD}
#    postgres:
#      jdbc-url: jdbc:postgresql://localhost:5432/postgres?useSSL=false
#      username: postgres
#      password: postgres123
#      driver-class-name: org.postgresql.Driver

  elasticsearch:
    # 本地 Docker ES 连接地址
    uris: http://localhost:9200
    # ES 8.x 默认安全性：如果本地测试关闭了安全认证，可注释掉 username/password
    username: elastic
    password: Es@123456
    connection-timeout: 10s
    socket-timeout: 30s

  # ==================== 自定义 ES 混合检索配置 ====================
  es:
    hybrid:
      # ES 索引名称
      index-name: knowledge_base
      # 向量相似度阈值
      similarity-threshold: 0.5
      # 每次检索返回的最大文档数
      top-k: 10
      # kNN 搜索的候选项数（需 > topK）
      num-candidates: 20
      # RRF 融合的排名窗口大小
      rank-window-size: 10
      # RRF 排名常数（默认 60）
      rank-constant: 60

  # 文件上传大小限制（文档上传需要较大限制）
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

# 关闭 Spring 自动数据源配置（关键）
autoconfigure:
  exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
